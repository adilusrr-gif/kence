server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    # Hashed build assets (app.[hash].js/css) are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # i18n bundles change between deploys but keep the same filename — always
    # revalidate so a new translation.json is picked up without a hard refresh.
    location /locales/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout    1800s;
        proxy_connect_timeout   60s;
        proxy_send_timeout    1800s;
        proxy_buffering       off;
    }
}