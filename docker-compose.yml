version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: kence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kenceai
      POSTGRES_USER: kence
      POSTGRES_PASSWORD: kence2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kence -d kenceai"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.18-community
    container_name: kence-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/kence_neo4j_2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "2G"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: kence-ollama
    volumes:
      - C:/Users/Admin/.ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_GPU_OVERHEAD=536870912
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    image: docai-backend:latest
    container_name: kence-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/data:/app/data
      - ./backend/org_storage:/app/org_storage
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:7b
      - EMBEDDING_MODEL=nomic-embed-text
      - DATABASE_URL=postgresql://kence:kence2026@postgres:5432/kenceai
      # Set a strong random value in production (e.g. openssl rand -hex 32)
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-only-insecure-change-in-production}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=kence_neo4j_2026
      - DEFAULT_ORG_SLUG=default
      - API_KEY_PREFIX=kce_
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: docai-frontend:latest
    container_name: kence-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
