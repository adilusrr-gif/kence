version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: kence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kenceai
      POSTGRES_USER: kence
      # REQUIRED — set POSTGRES_PASSWORD in .env (no insecure default)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only — the DB must not be reachable from outside the host
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kence -d kenceai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5.18-community
    container_name: kence-neo4j
    restart: unless-stopped
    environment:
      # REQUIRED — set NEO4J_PASSWORD in .env (no insecure default)
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "2G"
    ports:
      # Loopback only — Neo4j must not be reachable from outside the host
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:0.30.8
    container_name: kence-ollama
    volumes:
      # Reuse models already pulled by the host's systemd ollama service (read-only,
      # avoids re-downloading qwen3.5:122b/bge-m3/etc.)
      - /usr/share/.ollama/models:/root/.ollama/models:ro
      # Host trusts KZ's mandatory HTTPS-interception root CA (State Technical
      # Service / USIAG) in its system store; this image's base Ubuntu CA bundle
      # doesn't ship it, so registry.ollama.ai TLS verification fails inside the
      # container without this. Go's x509 reads SSL_CERT_FILE as an override.
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_GPU_OVERHEAD=536870912
      - OLLAMA_MAX_LOADED_MODELS=2   # allow 2 models in memory for parallel requests
      - OLLAMA_NUM_PARALLEL=6        # 6 concurrent requests: 3 reserved for chat + 3 agent lane (VRAM headroom ~136GB allows the extra KV cache)
      - OLLAMA_KEEP_ALIVE=-1         # keep models resident permanently (warmed at startup, never unload)
      - OLLAMA_FLASH_ATTENTION=true  # faster attention, esp. with large context
      - OLLAMA_CONTEXT_LENGTH=65536  # cap default context (was auto 262144 from VRAM)
      - LLM_MODEL=qwen3.5:122b       # warmed into VRAM at container startup (see entrypoint)
    # On startup: launch the server, wait until it answers, then preload the chat
    # model so the very first user request is already warm. The embedding model
    # (bge-m3) is warmed from the backend lifespan, since it needs an HTTP
    # /api/embeddings call and this image has no curl/python3.
    # ($$ escapes compose interpolation so the shell sees a literal $.)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        spid=$$!
        echo "[warmup] waiting for ollama to come up..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "[warmup] loading chat model $$LLM_MODEL"
        ollama run "$$LLM_MODEL" "ok" >/dev/null 2>&1 && echo "[warmup] $$LLM_MODEL ready" || echo "[warmup] $$LLM_MODEL FAILED"
        wait $$spid
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all   # qwen3.5:122b (~81GB) needs to span multiple L20 (46GB) GPUs
              capabilities: [gpu]
    restart: unless-stopped
    # Ollama healthcheck: verify the API is responding (curl isn't in this image)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # One-shot deployment job. NOT started by `docker-compose up` (profile-
  # gated) — run explicitly, once per deploy, BEFORE `docker-compose up -d
  # backend`:
  #   docker-compose --profile migrate run --rm migrate
  # Literal executable order: verify the build-pinned manifest, THEN run
  # `alembic upgrade head` — never the reverse, never in parallel. Exits
  # non-zero and runs no DDL at all if the manifest check fails. This
  # service only ever performs a plain upgrade (empty DB, or a DB already
  # stamped at B0 — a no-op). It never runs legacy adoption — that remains
  # a separate, explicit, manual command
  # (ops/schema_audit/adopt_legacy_schema.py), on purpose, so it can never
  # fire unattended from a deploy pipeline.
  migrate:
    image: docai-backend:latest
    container_name: kence-migrate
    profiles: ["migrate"]
    environment:
      - DATABASE_URL=postgresql://kence:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/kenceai
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "python verify_manifest.py && alembic upgrade head"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: docai-backend:latest
    container_name: kence-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/data:/app/data
      - ./backend/org_storage:/app/org_storage
      # Docling's layout/table-structure models (~500MB, fetched from huggingface.co
      # on first use). Kept in a bind mount so a container recreate doesn't lose them
      # and force a re-download.
      - ./backend/hf_cache:/root/.cache/huggingface
      # Host trusts KZ's mandatory HTTPS-interception root CA (State Technical
      # Service / USIAG) in its system store; this image's base Debian CA bundle
      # doesn't ship it, so TLS to huggingface.co (Docling model downloads) fails
      # inside the container without this.
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    environment:
      # requests/huggingface_hub bundle their own certifi CA file and ignore the
      # OS trust store by default — must point them at it explicitly.
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen3.5:122b
      - EMBEDDING_MODEL=bge-m3
      - DATABASE_URL=postgresql://kence:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/kenceai
      # REQUIRED — generate with: openssl rand -hex 32  then set JWT_SECRET_KEY in .env
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - DEFAULT_ORG_SLUG=default
      - API_KEY_PREFIX=kce_
      # Load tuning for 100 concurrent users.
      # Total Ollama budget = 6 (matches OLLAMA_NUM_PARALLEL); background agents are
      # capped to 3 slots so interactive chat always keeps the other 3 reserved.
      - LLM_MAX_CONCURRENT=6
      # 3 background slots → analysis agents' map fan-out runs in parallel while
      # 3 slots stay reserved for interactive chat.
      - LLM_AGENT_MAX_CONCURRENT=3
      - LLM_QUEUE_MAXSIZE=50
      # qwen3.5:122b cold-load (multi-GPU) + thinking-mode generation takes well over 60s
      - LLM_TIMEOUT_SEC=300
      # Background document-translation worker. Runs inside this backend container.
      # Set to "false" on web-only replicas if you ever run a dedicated worker node.
      - TRANSLATION_WORKER_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy   # now waits for Ollama healthcheck (was service_started)
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    # Backend healthcheck using the new /api/health endpoint (curl isn't in this image, use python3)
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    image: docai-frontend:latest
    container_name: kence-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy   # wait for backend to be ready
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
