version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: kence-ollama
    volumes:
      - C:/Users/Professional/.ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - CUDA_VISIBLE_DEVICES=-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  backend:
    build: ./backend
    container_name: kence-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_db:/app/chroma_db
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:7b
      - EMBEDDING_MODEL=nomic-embed-text
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: kence-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  unused:
